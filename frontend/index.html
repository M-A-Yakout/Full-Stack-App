<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
</head>

<body>
    <main>
        <div class="logo">
            <h1><i class="fa-solid fa-right-to-bracket"></i>NODE.Js</h1>
        </div>
        <section>
            <div class="loginPanel">
                <div class="header">
                    <h2>Login</h2>
                    <p>Login to access your travel account</p>
                </div>
                <form action="" method="post">
                    <div class="email">
                        <label for="emailLogin">Email</label>
                        <input type="email" name="emailLogin" id="emailLogin">
                    </div>
                    <div class="password">
                        <label for="passwordLogin">Password</label>
                        <div class="passwordInput">
                            <input type="password" name="passwordLogin" id="passwordLogin">
                            <i class="fa-solid fa-eye-slash"></i>
                        </div>
                    </div>
                    <div class="checkBox">
                        <div class="remember">
                            <input type="checkbox" name="remember" id="rememberMe">
                            <label for="rememberMe">Remember me</label>
                        </div>
                        <div class="forgot">
                            <a href="#">Forgot Password</a>
                        </div>
                    </div>
                    <div class="bottomLogin">
                        <input type="submit" value="Login">
                        <p>Don’t have an account? <a href="signup.html">Sign up</a></p>
                    </div>
                </form>
                <div class="loginWith">
                    <div class="line"></div>
                    <p>Or login with</p>
                    <div class="line"></div>
                </div>
                <div class="loginMethods">
                    <div class="borderIcon">
                        <i class="fa-brands fa-facebook loginImage" style="color: #1877f2;"></i>
                    </div>

                    <div class="borderIcon">
                        <i class="fa-brands fa-facebook loginImage"></i>
                    </div>

                    <div class="borderIcon">
                        <i class="fa-brands fa-apple loginImage" style="color: #000000;"></i>
                    </div>
                </div>
            </div>
            <div class="loginAvatar">
                <img src="assest/login/avatarLogin.png" alt="LoginImage">
                <div class="pill"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        </section>

    </main>
</body>

</html>
