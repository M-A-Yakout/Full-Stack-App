<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sing Up</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">

</head>

<body>
    <main>
        <div class="loginAvatar">
            <img src="assest/signup/sign.png" alt="LoginImage">
            <div class="pill"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
        <div class="logo">
            <h1><i class="fa-solid fa-right-to-bracket"></i>NODE.Js</h1>
        </div>
        <section>
            <div class="loginPanel">
                <div class="header">
                    <h2>Sign up</h2>
                    <p>Let’s get you all st up so you can access your personal account.</p>
                </div>
                <form action="" method="post">
                    <div class="Sign">
                        <div class="email">
                            <label for="firstname">First Name</label>
                            <input type="text" name="firstName" id="firstname">
                        </div>
                        <div class="email">
                            <label for="lastname">Last Name</label>
                            <input type="text" name="lastName" id="lastname">
                        </div>


                        <div class="email">
                            <label for="emailsignup">Email</label>
                            <input type="email" name="emailSignup" id="emailsignup">
                        </div>
                        <div class="email">
                            <label for="phonenumber">Phone Number</label>
                            <input type="tel" name="phoneNumber" id="phonenumber">
                        </div>
                    </div>
                    <div class="password">
                        <label for="passwordSign">Password</label>
                        <div class="passwordInput">
                            <input type="password" name="passwordSign" id="passwordSign">
                            <i class="fa-solid fa-eye-slash"></i>
                        </div>
                        <label for="passwordSign">Confirm Password</label>
                        <div class="passwordInput">
                            <input type="password" name="passwordSign" id="passwordSign">
                            <i class="fa-solid fa-eye-slash"></i>
                        </div>
                    </div>
                    <div class="checkBox">
                        <div class="remember">
                            <input type="checkbox" name="remember" id="rememberMe">
                            <label for="rememberMe">I agree to all the <b>Terms</b> and <b>Privacy Policies</b></label>
                        </div>
                    </div>
                    <div class="bottomLogin">
                        <input type="submit" value="Login">
                        <p>Already have an account? <a href="#">Login</a></p>
                    </div>
                </form>
                <div class="loginWith">
                    <div class="line"></div>
                    <p>Or Sign up with</p>
                    <div class="line"></div>
                </div>
                <div class="loginMethods">
                    <div class="borderIcon">
                        <i class="fa-brands fa-facebook loginImage" style="color: #1877f2;"></i>
                    </div>

                    <div class="borderIcon">
                        <i class="fa-brands fa-facebook loginImage"></i>
                    </div>

                    <div class="borderIcon">
                        <i class="fa-brands fa-apple loginImage" style="color: #000000;"></i>
                    </div>
                </div>
            </div>

        </section>

    </main>
</body>

</html>
